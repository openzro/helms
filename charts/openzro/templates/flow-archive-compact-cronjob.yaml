{{- /*
   Daily compaction of the flow archive.

   The sinks flush every fifteen minutes, so a low-traffic account
   produces a few kilobytes of Parquet per file and roughly a hundred
   files a day. Measured on a live bucket: 3,333 objects across thirty
   days became 47. Reading a single day used to open ~150 of them, and
   the round trips -- not the bytes -- were the whole cost.

   Daily, not hourly, and the reason is not taste. Compaction works on
   whole UTC days and deliberately skips today and yesterday, since the
   sink is still writing them; a day becomes eligible exactly once. More
   importantly, the archive is only ever read for windows older than
   OPENZRO_FLOW_RETENTION -- newer questions are answered from the hot
   store. A day therefore has that entire retention window to get
   compacted before anything reads it, which makes daily generous rather
   than tight.

   Off by default, and dry-run by default when on. This command deletes
   objects, so enabling it is two deliberate steps: turn the schedule on,
   watch a few manifests, then set deleteOriginals.
*/}}
{{- $c := .Values.management.archiveCompaction | default dict }}
{{- if and .Values.management.enabled $c.enabled }}
{{- /*
   Whether this Job has to read the dashboard's archive at all.

   It does not when the values or the environment already name a
   provider and a bucket -- the command short-circuits there and touches
   neither the management config nor the database. Everything below hangs
   off this: the database wiring, the config Secret, and whether SQLite
   is a problem.
*/}}
{{- $env := $c.env | default dict }}
{{- $envSecrets := $c.envFromSecret | default dict }}
{{- $envBucket := or (get $env "OPENZRO_FLOW_ARCHIVE_GCS_BUCKET") (get $env "OPENZRO_FLOW_ARCHIVE_S3_BUCKET") }}
{{- $envSecretBucket := or (get $envSecrets "OPENZRO_FLOW_ARCHIVE_GCS_BUCKET") (get $envSecrets "OPENZRO_FLOW_ARCHIVE_S3_BUCKET") }}
{{- $explicit := or (and $c.provider $c.bucket) $envBucket $envSecretBucket }}
{{- /*
   Reading the dashboard's archive means opening the management store,
   and on the embedded SQLite store that is a file under Datadir -- a PVC
   the Deployment mounts and this Job cannot, since most storage classes
   refuse a second attach. Postgres and MySQL reach the same data over
   the network, which is why they work and SQLite does not.

   Empty means neither Postgres nor MySQL: the helper names only those
   two, and absence is the SQLite fallback. Worth stating because the
   first version of this guard compared against "sqlite" and never fired.
*/}}
{{- $engine := include "openzro.store.engine" . }}
{{- if and (not $engine) (not $explicit) }}
{{- fail "management.archiveCompaction: with no postgres or mysql enabled the management store is SQLite -- a file on a volume only the management pod can mount, so this Job cannot read the archive configured in the dashboard. Name the archive explicitly instead: set management.archiveCompaction.provider and .bucket, or an OPENZRO_FLOW_ARCHIVE_*_BUCKET in .env, plus the credential in .envFromSecret. Or enable postgres/mysql." }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openzro.fullname" . }}-archive-compact
  namespace: {{ include "openzro.namespace" . }}
  labels:
    {{- include "openzro.management.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-compaction
spec:
  schedule: {{ $c.schedule | default "17 4 * * *" | quote }}
  timeZone: "Etc/UTC"
  # The window it compacts is a fixed calendar day, so a run that was
  # missed is not lost work -- the next one picks the same day up, and
  # the command is idempotent. Never run two at once against the same
  # bucket.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $c.startingDeadlineSeconds | default 3600 }}
  successfulJobsHistoryLimit: {{ $c.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $c.failedJobsHistoryLimit | default 3 }}
  suspend: {{ $c.suspend | default false }}
  jobTemplate:
    spec:
      backoffLimit: {{ $c.backoffLimit | default 0 }}
      template:
        metadata:
          labels:
            {{- include "openzro.management.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: archive-compaction
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "openzro.management.serviceAccountName" . }}
          {{- with $c.nodeSelector | default .Values.management.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.tolerations | default .Values.management.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: archive-compact
              image: "{{ .Values.management.image.repository }}:{{ .Values.management.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.management.image.pullPolicy }}
              {{- /*
                 The management image's entrypoint starts the server, so
                 both command and args are replaced. The day is computed
                 in the container rather than baked in at render time: a
                 CronJob manifest is rendered once and runs every day.
              */}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  DAY=$(date -u -d "{{ $c.lookbackDays | default 2 }} days ago" +%F)
                  echo "compacting UTC day ${DAY}"
                  /go/bin/openzro-mgmt flow-archive compact \
                    {{- /*
                       No --provider or --bucket by default. The command
                       reads the archive configured in the dashboard under
                       Integrations, which is where this deployment's
                       bucket and credential already live. Set these only
                       to point a run somewhere else.
                    */}}
                    {{- with $c.provider }}
                    --provider {{ . }} \
                    {{- end }}
                    {{- with $c.bucket }}
                    --bucket {{ . | quote }} \
                    {{- end }}
                    {{- with $c.prefix }}
                    --prefix {{ . | quote }} \
                    {{- end }}
                    {{- with $c.region }}
                    --region {{ . | quote }} \
                    {{- end }}
                    {{- with $c.endpoint }}
                    --endpoint {{ . | quote }} \
                    {{- end }}
                    --concurrency {{ $c.concurrency | default 1 }} \
                    --from "${DAY}" --to "${DAY}" \
                    {{- if $c.deleteOriginals }}
                    --manifest /tmp/manifest.jsonl \
                    --delete-originals
                    {{- else }}
                    --manifest /tmp/manifest.jsonl
                    {{- end }}
                  # The manifest is the record of what happened, and the
                  # pod's disk goes away with it. Emit it so the cluster's
                  # log pipeline keeps it.
                  echo "--- manifest ---"
                  cat /tmp/manifest.jsonl
              env:
                {{- /*
                   Reading the dashboard's row needs the same two things
                   the server needs: the database, and the key its
                   credentials are encrypted with. autoWiredEnv carries
                   the store connection; the key lives in the config file
                   mounted below.
                */}}
                {{- if not $explicit }}
                {{- include "openzro.management.autoWiredEnv" . | nindent 16 }}
                {{- end }}
                {{- range $key, $val := $c.env | default dict }}
                - name: {{ $key }}
                  value: {{ $val | quote }}
                {{- end }}
                {{- range $key, $val := $c.envFromSecret | default dict }}
                - name: {{ $key }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ (split "/" $val)._0 }}
                      key: {{ (split "/" $val)._1 }}
                {{- end }}
              resources:
                {{- toYaml ($c.resources | default dict) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- /*
                   The management config, for DataStoreEncryptionKey.
                   Same Secret the server mounts, read-only.
                */}}
                {{- if not $explicit }}
                - name: config
                  mountPath: /etc/openzro
                  readOnly: true
                {{- end }}
          volumes:
            # DuckDB spills to disk and the manifest is written here, so
            # /tmp cannot be the image's read-only layer.
            - name: tmp
              emptyDir:
                sizeLimit: {{ $c.tmpSizeLimit | default "2Gi" }}
            {{- if not $explicit }}
            # The same Secret the management Deployment mounts, so the
            # Job reads the identical DataStoreEncryptionKey rather than a
            # copy that can fall out of step with it. Mounted only when
            # the archive has to be read from the database: a Job that was
            # told where the bucket is has no business holding the key
            # every integration credential is encrypted with.
            - name: config
              secret:
                secretName: {{ .Values.management.existingConfigSecret | default (printf "%s-management" (include "openzro.fullname" .)) }}
            {{- end }}
{{- end }}
