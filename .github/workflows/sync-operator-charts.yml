name: Sync Operator Charts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Quick version check
        id: version-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="openzro/openzro-operator"
          UPSTREAM_BRANCH="main"

          # Fetch upstream Chart.yaml files
          upstream_operator_version=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/contents/helm/openzro-operator/Chart.yaml?ref=${UPSTREAM_BRANCH}" \
            | jq -r '.content' | base64 -d | grep '^version:' | awk '{print $2}')

          # Fetch local Chart.yaml files
          local_operator_version=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/charts/openzro-operator/Chart.yaml?ref=main" \
            | jq -r '.content' | base64 -d | grep '^version:' | awk '{print $2}')

          echo "upstream_operator_version=$upstream_operator_version" >> "$GITHUB_OUTPUT"
          echo "local_operator_version=$local_operator_version" >> "$GITHUB_OUTPUT"

          if [ "$upstream_operator_version" = "$local_operator_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changes detected:"
            echo "  openzro-operator: $local_operator_version -> $upstream_operator_version"
          fi

      - name: Check for existing sync PR
        if: steps.version-check.outputs.changed == 'true'
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match any sync/operator-charts-* head, regardless of the
          # trailing upstream SHA. gh pr list does prefix matching on
          # --head so the asterisk is implicit, but the upstream alias
          # we used to pass here ("sync/operator-charts" without a SHA)
          # was being treated as an exact match by some gh CLI builds
          # and never found a PR — leaving orphan branches behind on
          # the next push attempt. Use --search instead, which is
          # explicit substring matching.
          existing_pr=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "head:sync/operator-charts in:title" \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/operator-charts"))][0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Open sync PR already exists: #${existing_pr}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repo
        if: steps.version-check.outputs.changed == 'true' && steps.check-pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHART_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Clone upstream and sync charts
        if: steps.version-check.outputs.changed == 'true' && steps.check-pr.outputs.skip != 'true'
        id: sync
        run: |
          UPSTREAM_REPO="https://github.com/openzro/openzro-operator.git"

          # Shallow clone upstream
          git clone --depth 1 "$UPSTREAM_REPO" /tmp/upstream

          # Get upstream short SHA
          upstream_sha=$(git -C /tmp/upstream rev-parse --short HEAD)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          # Sync charts using rsync --delete to mirror upstream exactly
          rsync -avc --delete /tmp/upstream/helm/openzro-operator/ charts/openzro-operator/

          # Extract versions
          operator_version=$(grep '^version:' charts/openzro-operator/Chart.yaml | awk '{print $2}')
          echo "operator_version=$operator_version" >> "$GITHUB_OUTPUT"

          # Clean up
          rm -rf /tmp/upstream

      - name: Create PR
        if: steps.version-check.outputs.changed == 'true' && steps.check-pr.outputs.skip != 'true'
        env:
          # CHART_SYNC_TOKEN é um PAT opcional — sem ele, PRs criados pelo
          # GITHUB_TOKEN não disparam workflow_run nos status checks, mas
          # ao menos o PR é aberto. Fallback evita exit 4 (gh CLI sem token).
          GH_TOKEN: ${{ secrets.CHART_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/operator-charts-${{ steps.sync.outputs.upstream_sha }}"
          OPERATOR_VERSION="${{ steps.sync.outputs.operator_version }}"

          # Check if there are actual changes
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No file changes after sync — versions may differ in API but files are identical"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch, commit, and push. If a prior run already
          # created this exact branch (same upstream SHA) but never
          # opened a PR — happens when `gh pr create` failed after the
          # push — the second run would fail with non-fast-forward and
          # the cron job would stay red until someone deletes the
          # branch by hand. --force-with-lease is safe here because
          # the branch is single-purpose (this workflow is the only
          # writer) and resets the branch to the freshly synced tree;
          # any partial state from the previous run is dropped on
          # purpose.
          git checkout -b "$BRANCH"
          git add -A charts/openzro-operator/
          git commit -m "sync operator charts from upstream (${{ steps.sync.outputs.upstream_sha }})"
          git push --force-with-lease origin "$BRANCH"

          # Build PR body
          BODY="## Synced Charts from Upstream

          Upstream commit: openzro/openzro-operator@${{ steps.sync.outputs.upstream_sha }}

          | Chart | Version |
          |-------|---------|
          | openzro-operator | ${OPERATOR_VERSION} |"

          # Open PR. If a PR is somehow already open against this
          # exact branch (rare — the check-pr step above usually
          # catches it), gh pr create exits with "PR already exists";
          # treat that as success and move on to auto-merge instead
          # of failing the cron run.
          if ! gh pr create \
            --title "sync operator charts from upstream" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"; then
            echo "gh pr create failed — check whether a PR already exists for $BRANCH"
            gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open || true
          fi

          # Enable auto-merge (requires branch protection with required checks)
          gh pr merge "$BRANCH" --auto --squash || \
            echo "auto-merge could not be enabled — leave PR open for manual review"
